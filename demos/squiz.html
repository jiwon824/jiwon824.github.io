<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SQUIZ 데모 · 퀴즈 도메인</title>
<style>
/* =============================================================================
   SQUIZ 디자인 토큰
   원본: modustudy/frontend/src/assets/styles/index.css (라이트 테마)
   ============================================================================= */
:root {
  --color-white: #FFFFFF;
  --color-black: #202124;
  --color-gray-50: #F8F9FA;
  --color-gray-100: #E8EAED;
  --color-gray-300: #DADCE0;
  --color-gray-500: #5F6368;
  --color-gray-700: #3C4043;

  --color-google-blue: #4285F4;
  --color-google-red: #EA4335;
  --color-google-yellow: #FBBC04;
  --color-google-green: #34A853;
  --color-google-blue-light: #E8F0FE;
  --color-google-red-light: #FCE8E6;
  --color-google-yellow-light: #FEF7E0;
  --color-google-green-light: #E6F4EA;

  --color-primary: var(--color-google-blue);
  --color-secondary: var(--color-google-green);
  --color-accent: var(--color-google-yellow);
  --color-bg: var(--color-gray-50);

  --color-primary-light: #7BAAF7;
  --color-primary-dark: #1A73E8;
  --color-primary-alpha-10: rgba(66, 133, 244, 0.1);
  --color-primary-alpha-20: rgba(66, 133, 244, 0.2);

  --color-secondary-dark: #1E8E3E;
  --color-secondary-alpha-20: rgba(52, 168, 83, 0.2);

  --color-background: var(--color-bg);
  --color-background-secondary: #F1F3F4;
  --color-surface: #FFFFFF;
  --color-surface-hover: #FFFEF8;

  --color-text-primary: var(--color-black);
  --color-text-secondary: var(--color-gray-700);
  --color-text-tertiary: var(--color-gray-500);

  --color-success: var(--color-google-green);
  --color-success-light: var(--color-google-green-light);
  --color-warning: var(--color-google-yellow);
  --color-warning-light: var(--color-google-yellow-light);
  --color-warning-dark: #F9AB00;
  --color-error: var(--color-google-red);
  --color-error-light: var(--color-google-red-light);
  --color-info: var(--color-google-blue);
  --color-info-light: var(--color-google-blue-light);

  --border-light: rgba(128, 161, 186, 0.2);
  --color-border: var(--border-light);

  --color-shadow: rgba(44, 62, 80, 0.06);
  --color-shadow-medium: rgba(44, 62, 80, 0.1);
  --color-shadow-strong: rgba(44, 62, 80, 0.14);

  --font-size-xs: 0.75rem;
  --font-size-sm: 0.875rem;
  --font-size-base: 1rem;
  --font-size-lg: 1.125rem;
  --font-size-xl: 1.25rem;
  --font-size-2xl: 1.5rem;
  --font-size-3xl: 1.875rem;

  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  --line-height-relaxed: 1.75;

  --spacing-xs: 0.25rem;
  --spacing-sm: 0.5rem;
  --spacing-md: 1rem;
  --spacing-lg: 1.5rem;
  --spacing-xl: 2rem;
  --spacing-2xl: 3rem;

  --radius-main: 8px;
  --radius-pill: 24px;
  --radius-sm: 0.25rem;
  --radius-md: var(--radius-main);
  --radius-lg: 0.75rem;
  --radius-xl: 1rem;
  --radius-2xl: 1.5rem;
  --radius-full: 9999px;

  --shadow-sm: 0 2px 4px var(--color-shadow);
  --shadow-md: 0 4px 8px var(--color-shadow-medium);
  --shadow-xl: 0 12px 24px var(--color-shadow-strong);

  --transition-fast: 150ms ease-in-out;
  --transition-base: 250ms ease-in-out;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--color-background);
  color: var(--color-text-primary);
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI',
    Roboto, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; }

/* =============================================================================
   데모 크롬 — 실제 앱에는 없는, 데모용 상단 바
   ============================================================================= */
.demo-chrome {
  position: sticky;
  top: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  background: #16181d;
  color: #c9cdd6;
  font-size: 12px;
  letter-spacing: -0.01em;
}
.demo-chrome .dc-title { font-weight: 700; color: #fff; letter-spacing: -0.02em; }
.demo-chrome .dc-sep { color: #4a4f5a; }
.demo-chrome .dc-route {
  font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
  background: #23262d;
  border-radius: 6px;
  padding: 3px 8px;
  color: #8ab4f8;
}
.demo-chrome .dc-spacer { flex: 1; }
.demo-chrome .dc-btn {
  background: #23262d;
  border: 1px solid #333842;
  color: #c9cdd6;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 12px;
  cursor: pointer;
  transition: all var(--transition-fast);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  white-space: nowrap;
  font-family: inherit;
}
.demo-chrome .dc-btn:hover { background: #2c3039; color: #fff; }
@media (max-width: 720px) {
  .demo-chrome { gap: 8px; padding: 8px 12px; }
  .demo-chrome .dc-label, .demo-chrome .dc-sep { display: none; }
}

/* =============================================================================
   공통 레이아웃 유틸
   ============================================================================= */
.screen { min-height: calc(100vh - 37px); }
.wrap-7xl { max-width: 80rem; margin: 0 auto; }
.wrap-6xl { max-width: 72rem; margin: 0 auto; }
.wrap-4xl { max-width: 56rem; margin: 0 auto; }
.wrap-3xl { max-width: 48rem; margin: 0 auto; }

/* =============================================================================
   Button — shared/components/Button 의 google-* 변형 재현
   ============================================================================= */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: var(--radius-md);
  font-weight: var(--font-weight-semibold);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all var(--transition-fast);
  white-space: nowrap;
}
.btn:disabled { cursor: not-allowed; }
.btn-sm { padding: 0.375rem 0.75rem; font-size: var(--font-size-sm); }
.btn-md { padding: 0.5rem 1rem; font-size: var(--font-size-base); }
.btn-lg { padding: 0.75rem 1.25rem; font-size: var(--font-size-base); }

.btn-primary { background: var(--color-primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--color-primary-dark); box-shadow: var(--shadow-md); }
.btn-primary:disabled { opacity: 0.5; }

.btn-outline { background: transparent; color: var(--color-primary); border-color: var(--color-primary); }
.btn-outline:hover:not(:disabled) { background: var(--color-primary-alpha-10); }

.btn-ghost { background: transparent; color: var(--color-text-secondary); }
.btn-ghost:hover:not(:disabled) { background: var(--color-gray-100); }

.btn-danger { background: var(--color-error); color: #fff; }
.btn-danger:hover:not(:disabled) { background: #C5221F; }

.btn-secondary { background: var(--color-background-secondary); color: var(--color-text-secondary); }
.btn-secondary:hover:not(:disabled) { background: var(--color-gray-100); }

/* =============================================================================
   PageNavHeader / Breadcrumb
   ============================================================================= */
.page-nav { margin-bottom: var(--spacing-xl); }
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--font-size-sm);
  color: var(--color-text-tertiary);
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.breadcrumb a { color: var(--color-text-tertiary); text-decoration: none; cursor: pointer; }
.breadcrumb a:hover { color: var(--color-primary); text-decoration: underline; }
.breadcrumb .sep { opacity: 0.5; }
.breadcrumb .current { color: var(--color-text-secondary); font-weight: var(--font-weight-medium); }
.page-nav-row { display: flex; align-items: center; gap: 12px; }
.page-nav-title { font-size: var(--font-size-2xl); font-weight: var(--font-weight-bold); margin: 0; }

/* =============================================================================
   QuizGameSelection — /quiz
   ============================================================================= */
.game-screen { background: #fff; padding: 24px; }
@media (min-width: 768px) { .game-screen { padding: 32px; } }
@media (min-width: 1024px) { .game-screen { padding: 40px; } }

.game-header {
  position: relative;
  margin-bottom: 48px;
  border-radius: var(--radius-2xl);
  padding: 32px;
  backdrop-filter: blur(12px);
  overflow: hidden;
  background-color: rgba(255, 255, 255, 0.9);
}
@media (min-width: 768px) { .game-header { padding: 40px; } }

.game-header-row {
  display: flex;
  flex-direction: column;
  gap: 24px;
  position: relative;
  z-index: 10;
}
@media (min-width: 768px) {
  .game-header-row { flex-direction: row; align-items: center; justify-content: space-between; }
}
.game-eyebrow {
  display: flex; align-items: center; gap: 8px;
  color: var(--color-google-blue);
  font-weight: 900; font-size: 12px;
  text-transform: uppercase; letter-spacing: 0.1em;
  margin-bottom: 12px;
}
.game-title {
  font-size: 2.25rem; font-weight: 900; letter-spacing: -0.025em;
  margin: 0 0 12px; color: #1f2937;
}
@media (min-width: 768px) { .game-title { font-size: 3rem; } }
.game-sub { font-size: 1.125rem; font-weight: 500; color: #4b5563; margin: 0; }

.mascot-slot { display: none; position: relative; }
@media (min-width: 768px) { .mascot-slot { display: block; } }

.game-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 32px;
}
@media (min-width: 768px) { .game-grid { grid-template-columns: repeat(2, 1fr); gap: 40px; } }
@media (min-width: 1024px) { .game-grid { grid-template-columns: repeat(3, 1fr); gap: 48px; } }

.game-card {
  position: relative;
  cursor: pointer;
  border-radius: 24px;
  padding: 28px;
  transition: all 500ms;
  overflow: hidden;
  box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  min-height: 380px;
  border: none;
  text-align: left;
  animation: slideInUp 600ms ease-out backwards;
}
@media (min-width: 768px) { .game-card { padding: 36px; } }
@media (min-width: 1024px) { .game-card { padding: 40px; } }
.game-card:hover { transform: translateY(-16px); }

.gc-commentle { background: linear-gradient(to bottom right, #EFF6FF, #ECFEFF); }
.gc-contest   { background: linear-gradient(to bottom right, #ECFDF5, #F0FDF4); }
.gc-practice  { background: linear-gradient(to bottom right, #FFFBEB, #FFF7ED); }

.gc-sparkle {
  position: absolute; top: 16px; right: 16px;
  opacity: 0; transition: opacity 300ms; color: #FBBF24;
}
.game-card:hover .gc-sparkle { opacity: 1; }

.gc-tagrow { height: 24px; margin-bottom: 8px; }
.gc-tag {
  display: inline-block; padding: 4px 12px;
  border-radius: var(--radius-full);
  font-size: 10px; font-weight: 900; text-transform: uppercase;
}
.gc-tag-hot { background: #FEE2E2; color: #DC2626; border: 1px solid #FECACA; }
.gc-tag-soon { background: #F3F4F6; color: #6B7280; border: 1px solid #E5E7EB; }

.gc-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 64px; height: 64px; border-radius: var(--radius-xl);
  box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
  transition: all 500ms; margin-bottom: 20px;
}
.game-card:hover .gc-icon { transform: scale(1.1) rotate(6deg); }
.gc-icon-commentle { background: linear-gradient(to bottom right, #3B82F6, #22D3EE); }
.gc-icon-contest   { background: linear-gradient(to bottom right, #10B981, #4ADE80); }
.gc-icon-practice  { background: linear-gradient(to bottom right, #F59E0B, #FB923C); }

.gc-body { display: flex; flex-direction: column; flex-grow: 1; }
.gc-name { font-size: 1.25rem; font-weight: 900; color: #1f2937; margin: 0 0 4px; }
@media (min-width: 768px) { .gc-name { font-size: 1.5rem; } }
.gc-subtitle { font-size: 0.875rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.025em; margin: 0; }
.gc-sub-commentle { color: #2563EB; }
.gc-sub-contest { color: #059669; }
.gc-sub-practice { color: #D97706; }
.gc-desc { font-size: 0.875rem; color: #4B5563; line-height: 1.625; margin: 12px 0 16px; }

.gc-fx { height: 42px; display: flex; align-items: center; }
.gc-terminal {
  font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
  font-size: 12px; background: #111827; color: #4ADE80;
  padding: 8px 12px; border-radius: var(--radius-lg); width: 100%;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
}
.gc-versus { display: flex; align-items: center; justify-content: center; gap: 16px; width: 100%; }
.gc-fighter {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: #fff; font-weight: 900;
  box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
}
.gc-fighter-p1 { background: linear-gradient(to bottom right, #60A5FA, #2563EB); }
.gc-fighter-p2 { background: linear-gradient(to bottom right, #F87171, #DC2626); }
.gc-vs { font-size: 1.125rem; font-weight: 900; color: #F97316; }
.gc-progress-label { display: flex; justify-content: space-between; font-size: 12px; color: #6B7280; margin-bottom: 4px; }
.gc-progress-track { height: 8px; background: rgba(255,255,255,0.5); border-radius: var(--radius-full); overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.06); }
.gc-progress-fill { height: 100%; background: linear-gradient(to right, #FBBF24, #F97316); border-radius: var(--radius-full); }

.gc-footer {
  margin-top: 16px; padding-top: 16px;
  border-top: 1px solid rgba(229,231,235,0.5);
  display: flex; align-items: center; justify-content: space-between;
}
.gc-footer span { font-size: 12px; font-weight: 500; color: #9CA3AF; }
.gc-footer .gc-arrow { color: #9CA3AF; transition: all 300ms; }
.game-card:hover .gc-footer .gc-arrow { color: #4B5563; transform: translateX(4px); }

/* 애니메이션 — DashboardV2.css 원본 */
@keyframes slideInUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes typingCursor { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
.typing-cursor {
  display: inline-block; width: 2px; height: 1em;
  background-color: currentColor; margin-left: 2px;
  animation: typingCursor 1s infinite;
}
@keyframes progressFill { 0% { width: 0%; } 50% { width: 75%; } 100% { width: 100%; } }
@keyframes progressPulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
.progress-bar-animated { animation: progressFill 3s ease-in-out infinite; }
.progress-bar-pulse { animation: progressPulse 1.5s ease-in-out infinite; color: #D97706; font-weight: 500; }
@keyframes fighterLeft { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
@keyframes fighterRight { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-4px); } }
@keyframes vsPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
.fighter-left { animation: fighterLeft 0.8s ease-in-out infinite; }
.fighter-right { animation: fighterRight 0.8s ease-in-out infinite; animation-delay: 0.4s; }
.vs-pulse { animation: vsPulse 1s ease-in-out infinite; }

.bubble-container { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
@keyframes bubbleFloat {
  0%   { transform: translateY(0) scale(1); opacity: 0; }
  5%   { opacity: 0.7; }
  90%  { opacity: 0.4; }
  100% { transform: translateY(-150px) scale(0.6); opacity: 0; }
}
@keyframes bubbleWobble {
  0%, 100% { margin-left: 0; }
  25% { margin-left: -4px; }
  75% { margin-left: 4px; }
}
.bubble {
  position: absolute; bottom: -20px; border-radius: 50%;
  background: linear-gradient(135deg, rgba(66,133,244,0.4) 0%, rgba(66,133,244,0.15) 100%);
  border: 1px solid rgba(66,133,244,0.3);
  animation: bubbleFloat 4s ease-out infinite, bubbleWobble 2s ease-in-out infinite;
  pointer-events: none;
}
.bubble::before {
  content: ''; position: absolute; top: 15%; left: 20%;
  width: 30%; height: 30%; background: rgba(255,255,255,0.7); border-radius: 50%;
}
.bubble-1 { width: 14px; height: 14px; left: 5%;  animation-delay: 0s;   animation-duration: 3.5s, 2s; }
.bubble-2 { width: 10px; height: 10px; left: 15%; animation-delay: 0.7s; animation-duration: 4s, 2.2s; }
.bubble-3 { width: 16px; height: 16px; left: 25%; animation-delay: 1.4s; animation-duration: 3.8s, 1.8s; }
.bubble-4 { width: 8px;  height: 8px;  left: 35%; animation-delay: 0.3s; animation-duration: 4.2s, 2.5s; }
.bubble-5 { width: 12px; height: 12px; left: 45%; animation-delay: 2s;   animation-duration: 3.6s, 2.1s; }
.bubble-6 { width: 9px;  height: 9px;  left: 55%; animation-delay: 1s;   animation-duration: 4.5s, 1.9s; }
.bubble-7 { width: 11px; height: 11px; left: 65%; animation-delay: 1.8s; animation-duration: 3.9s, 2.3s; }
.bubble-8 { width: 13px; height: 13px; left: 75%; animation-delay: 0.5s; animation-duration: 4.1s, 2s; }

/* 마스코트 */
.mascot { position: relative; display: inline-block; filter: drop-shadow(0 20px 13px rgba(0,0,0,0.15)); }
.mascot img { width: 100%; height: 100%; object-fit: contain; user-select: none; }
.pupil {
  position: absolute; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 35% 35%, #3d3d4d 0%, #1a1a2d 100%);
  box-shadow: inset 0 -1px 2px rgba(255,255,255,0.1);
  transition: transform 0.1s ease-out;
}
.pupil .hl { position: absolute; border-radius: 50%; background: #fff; }

/* =============================================================================
   QuizCourseList — /quiz-practice
   ============================================================================= */
.list-screen { padding: var(--spacing-2xl) var(--spacing-lg); }

.filter-row {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: 8px; margin-bottom: 32px; padding: var(--spacing-md) 0;
}
.filter-btn {
  padding: 0.5rem 1rem;
  border-radius: var(--radius-pill);
  border: 1px solid var(--color-border);
  background: transparent;
  color: var(--color-text-secondary);
  font-weight: var(--font-weight-medium);
  font-size: var(--font-size-sm);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.course-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: var(--spacing-lg);
}
.course-card {
  background: #fff;
  border-radius: 24px;
  transition: all var(--transition-base);
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  overflow: hidden;
  cursor: pointer;
  border: none;
  text-align: left;
  padding: var(--spacing-xl);
  padding-bottom: var(--spacing-lg);
  width: 100%;
  display: block;
}
.course-card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
.cc-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
.cc-icon {
  width: 48px; height: 48px; border-radius: var(--radius-lg);
  display: flex; align-items: center; justify-content: center;
}
.cc-badge {
  padding: 0.25rem 0.75rem; border-radius: var(--radius-pill);
  font-size: var(--font-size-xs); font-weight: var(--font-weight-semibold);
}
.cc-title { font-size: var(--font-size-xl); font-weight: var(--font-weight-bold); margin: 0 0 8px; color: var(--color-text-primary); }
.cc-desc { font-size: var(--font-size-sm); color: var(--color-text-secondary); line-height: var(--line-height-relaxed); margin: 0; }

.info-footer {
  margin-top: 48px; text-align: center;
  padding: var(--spacing-lg);
  background: var(--color-primary-alpha-10);
  border-radius: var(--radius-lg);
  color: var(--color-text-secondary);
}
.info-footer p { margin: 0; line-height: 1.6; }

.empty-state { text-align: center; padding: 48px 0; color: var(--color-text-tertiary); font-size: var(--font-size-lg); }

/* =============================================================================
   CourseDetail — /quiz-practice/:courseId
   ============================================================================= */
.detail-header-card {
  background: var(--color-surface);
  border-radius: var(--radius-xl);
  border: 2px solid var(--color-border);
  padding: var(--spacing-xl);
  box-shadow: var(--shadow-sm);
}
.detail-header-wrap { margin-bottom: var(--spacing-xl); }
.dh-icon { width: 56px; height: 56px; border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; }
.dh-badge { padding: 0.375rem 1rem; border-radius: var(--radius-pill); font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold); }
.dh-title { font-size: var(--font-size-3xl); font-weight: var(--font-weight-bold); margin: 0 0 12px; }
.dh-desc { font-size: var(--font-size-base); color: var(--color-text-secondary); line-height: var(--line-height-relaxed); margin: 0; }

.section-list {
  background: var(--color-surface);
  border-radius: var(--radius-xl);
  border: 1px solid var(--color-border);
  overflow: hidden;
}
.section-list-head {
  padding: var(--spacing-md) var(--spacing-lg);
  border-bottom: 1px solid var(--color-border);
  background: var(--color-background-secondary);
}
.section-list-head h2 { font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold); margin: 0; }

/* =============================================================================
   "서버" — 채점은 전적으로 이쪽에서 수행한다
   원본 설계: 클라이언트는 선택한 답안 값만 보내고,
   서버가 보유한 정답 데이터와 문제 유형 기준으로 직접 채점한다.
   ============================================================================= */
const server = {
  /**
   * 답안 제출 — 클라이언트는 isCorrect를 보내지 않는다.
   * @param questionId 문제 ID
   * @param submitted  사용자가 선택/입력한 값 (string | string[])
   */
  submitAnswer: function (questionId, submitted) {
    const q = QUESTIONS.find(function (x) { return x.id === questionId; });
    if (!q) return { isCorrect: false, correctAnswer: '', explanation: '' };

    let isCorrect = false;

    if (q.type === 'multiple-choice') {
      // 다중선택: 순서 무관 비교를 위해 Set으로 파싱해서 대조
      const sub = new Set(Array.isArray(submitted) ? submitted : []);
      const ans = new Set(q.correctAnswer);
      isCorrect = sub.size === ans.size &&
        Array.from(ans).every(function (id) { return sub.has(id); });
    } else if (q.type === 'short-answer') {
      // 단답형: 대소문자/앞뒤 공백 무시
      const sub = String(submitted || '').trim().toLowerCase();
      isCorrect = sub.length > 0 && sub === String(q.correctAnswer).toLowerCase();
    } else {
      // 단일선택
      isCorrect = submitted === q.correctAnswer;
    }

    return {
      isCorrect: isCorrect,
      correctAnswer: formatCorrectAnswer(q),
      explanation: q.explanation,
    };
  },
};

function formatCorrectAnswer(q) {
  if (q.type === 'short-answer') return q.correctAnswer;
  const ids = Array.isArray(q.correctAnswer) ? q.correctAnswer : [q.correctAnswer];
  return ids.map(function (id) {
    const opt = (q.options || []).find(function (o) { return o.id === id; });
    return opt ? opt.text : id;
  }).join(', ');
}

/* =============================================================================
   해시 라우팅
   -----------------------------------------------------------------------------
   URL 해시를 화면의 단일 출처로 삼는다. 모든 이동은 location.hash 변경 →
   hashchange → applyHash() → render() 순서로 흐르므로, 브라우저 뒤로가기가
   앱 내부 이동과 그대로 맞물린다. 마지막 뒤로가기는 포트폴리오로 돌아간다.
   ============================================================================= */
const ROUTES = [
  { re: /^\/quiz$/,                                    screen: 'game' },
  { re: /^\/quiz-practice$/,                           screen: 'courses' },
  { re: /^\/quiz-practice\/(\d+)$/,                    screen: 'detail' },
  { re: /^\/continuous-quiz\/(\d+)\/section\/(\d+)$/,  screen: 'session' },
  { re: /^\/quiz-contest$/,                            screen: 'contest' },
  { re: /^\/quiz-commentle$/,                          screen: 'commentle' },
];

/** 해시를 바꿔 이동한다 — 히스토리에 한 칸 쌓인다 */
function go(path) {
  if (location.hash === '#' + path) { render(); return; }
  location.hash = path;   // hashchange → applyHash → render
}

/** 현재 해시를 읽어 상태에 반영한다 (뒤로/앞으로, 직접 진입 포함) */
function applyHash() {
  const path = location.hash.replace(/^#/, '') || '/quiz';

  let matched = null, m = null;
  for (let i = 0; i < ROUTES.length; i++) {
    m = path.match(ROUTES[i].re);
    if (m) { matched = ROUTES[i]; break; }
  }
  if (!matched) { location.replace('#/quiz'); return; }

  if (matched.screen === 'detail') {
    const id = Number(m[1]);
    if (!getCourse(id)) { location.replace('#/quiz-practice'); return; }
    state.courseId = id;
    state.screen = 'detail';

  } else if (matched.screen === 'session') {
    const id = Number(m[1]);
    if (!getCourse(id)) { location.replace('#/quiz-practice'); return; }
    state.courseId = id;
    state.sectionNumber = Number(m[2]);
    // 앞으로가기나 새로고침으로 들어온 경우 세션을 새로 구성한다
    // (진행 중이던 세션은 URL에 담기지 않으므로 복원할 수 없다)
    if (state.screen !== 'session') prepareSession(id, state.sectionNumber, state.limit);
    state.screen = 'session';

  } else {
    state.screen = matched.screen;
  }

  window.scrollTo(0, 0);
  render();
}

window.addEventListener('hashchange', applyHash);

        '<p class="dh-desc">' + course.sections.length + '개의 섹션으로 구성된 코스입니다</p>' +
      '</div></div>' +

      '<div class="section-list">' +
        '<div class="section-list-head"><h2>섹션 목록</h2></div>' +
        '<div>' + rows + '</div>' +
      '</div>' +

      '<div class="info-footer"><p><strong>💡 Tip:</strong> 원하는 섹션부터 <strong>자유롭게 학습</strong>하세요!<br />' +
        '학습한 내용은 잊어버리지 않도록 제때 복습시켜 드릴게요.</p></div>' +
    '</div>' +
    (state.showLimitModal ? renderLimitModal() : '') +

}

function renderLimitModal() {
  const opts = [5, 10, 20, 30, 50];
  let btns = '';
  opts.forEach(function (o) {
    btns += '<button class="btn btn-sm ' + (state.limit === o ? 'btn-primary' : 'btn-outline') +
      '" data-limit="' + o + '">' + o + '</button>';
  });
  return '' +
    '<div class="overlay" data-overlay="limit"><div class="modal-panel modal-sm">' +
      '<h3 class="modal-title">학습량 설정</h3>' +
      '<p class="text-center" style="color:var(--color-text-secondary);margin:0 0 24px">' +
        '이번 세션에서 풀 문제 수를 선택해주세요.</p>' +
      '<div class="limit-grid">' + btns + '</div>' +
      '<div class="flex gap-3" style="margin-top:24px">' +

        '<button class="btn btn-primary btn-md flex-1" data-limit-start>학습 시작</button>' +
      '</div>' +
    '</div></div>';

/* =============================================================================
   화면 4 — ContinuousQuizSession
   ============================================================================= */
function buildQueue(course, limit) {
  const own = QUESTIONS.filter(function (q) { return q.code === course.code; });
  const rest = QUESTIONS.filter(function (q) { return q.code !== course.code; });
  shuffle(own); shuffle(rest);
  return own.concat(rest).slice(0, limit);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

/** 세션 상태를 새로 구성한다 (히스토리는 건드리지 않는다) */
function prepareSession(courseId, sectionNumber, limit) {
  const course = getCourse(courseId);
  state.courseId = courseId;
  state.sectionNumber = sectionNumber;
  state.limit = limit;
  state.queue = buildQueue(course, limit);
  state.index = 0;
  state.solvedCount = 0;
  state.correctCount = 0;
  state.responseTimes = [];
  state.answer = null;
  state.isSubmitting = false;
  state.showFeedback = false;
  state.feedbackData = null;
  state.showSkipConfirm = false;
  state.summary = null;
  state.screen = 'session';
  timer.start();
}

/** 세션을 시작하고 히스토리에 한 칸 쌓는다 */
function startSession(courseId, sectionNumber, limit) {
  prepareSession(courseId, sectionNumber, limit);
  go('/continuous-quiz/' + courseId + '/section/' + sectionNumber);
}

function currentQuestion() {
  return state.queue[state.index] || null;
}

function isAnswerValid() {
  const q = currentQuestion();
  if (!q) return false;
  if (q.type === 'multiple-choice') return Array.isArray(state.answer) && state.answer.length > 0;
  if (q.type === 'short-answer') return typeof state.answer === 'string' && state.answer.trim().length > 0;
  return !!state.answer;
}

const TYPE_LABELS = {
  'single-choice': '단일선택',
  'multiple-choice': '다중선택',
  'short-answer': '단답형',
};
const DIFFICULTY_CHIP = {
  Easy:   { label: '초급', bg: 'var(--color-google-green-light)',  color: 'var(--color-google-green)' },
  Medium: { label: '중급', bg: 'var(--color-google-yellow-light)', color: 'var(--color-google-yellow)' },
  Hard:   { label: '고급', bg: 'var(--color-google-red-light)',    color: 'var(--color-google-red)' },
};

function renderSession() {
  const q = currentQuestion();
  if (!q) return renderComplete();

  const accuracy = state.solvedCount > 0
    ? Math.round((state.correctCount / state.solvedCount) * 100) : 0;
  const diff = DIFFICULTY_CHIP[q.difficulty];

  // 답변 영역
  let answerArea = '';
  if (q.type === 'short-answer') {
    answerArea =
      '<div><input class="qc-input" id="shortAnswer" type="text" placeholder="답을 입력하세요..." ' +
        'value="' + esc(typeof state.answer === 'string' ? state.answer : '') + '" autocomplete="off" />' +
      '<p class="qc-hint">대소문자 구분 없이 정답이 채점됩니다.</p></div>';
  } else {
    let opts = '';
    (q.options || []).forEach(function (o) {
      const selected = q.type === 'single-choice'
        ? state.answer === o.id
        : (Array.isArray(state.answer) && state.answer.indexOf(o.id) !== -1);
      const iconName = q.type === 'single-choice'
        ? (selected ? 'checkCircle' : 'circle')
        : (selected ? 'checkSquare' : 'square');
      opts +=
        '<button class="qc-option' + (selected ? ' selected' : '') + '" data-option="' + o.id + '">' +
          icon(iconName, 22, selected ? 'var(--color-primary)' : 'var(--color-text-tertiary)') +
          '<span class="label">' + esc(o.text) + '</span>' +
        '</button>';
    });
    answerArea = '<div class="qc-options">' + opts + '</div>';
  }

  const submitDisabled = !isAnswerValid() || state.isSubmitting;

  return '' +
    '<div class="screen session-screen">' +
      '<header class="session-header"><div class="session-header-inner">' +
        '<div class="breadcrumb">' +
          '<a data-nav="/quiz">퀴즈</a><span class="sep">/</span><span class="current">연속 학습</span>' +
        '</div>' +
        '<div class="sh-row">' +
          '<button class="btn btn-ghost btn-sm" data-session-exit>' + icon('arrowLeft', 18) + '나가기</button>' +
          '<span class="sh-mode">연속 학습</span>' +
        '</div>' +
        '<div class="sh-stats">' +
          '<span>진행: <strong style="color:var(--color-primary)">' + state.solvedCount + '</strong> / ' + state.queue.length + '</span>' +
          '<span>정답률: <strong style="color:var(--color-success)">' + accuracy + '%</strong></span>' +
        '</div>' +
      '</div></header>' +

      '<main class="session-main">' +
        '<div class="question-card">' +
          '<div class="qc-meta">' +
            '<span class="qc-num">Q' + (state.index + 1) + '</span>' +
            '<span class="qc-chip qc-chip-type">' + TYPE_LABELS[q.type] + '</span>' +
            '<span class="qc-chip" style="background:' + diff.bg + ';color:' + diff.color + '">' + diff.label + '</span>' +
            '<span class="qc-chip qc-chip-cat">' + esc(q.category) + '</span>' +
          '</div>' +
          '<div class="qc-question">' + esc(q.question) + '</div>' +
          answerArea +
          (q.type === 'multiple-choice'
            ? '<p class="qc-hint">💡 해당하는 항목을 모두 선택하세요.</p>' : '') +
        '</div>' +

        '<div class="qc-nav">' +
          '<button class="btn btn-ghost btn-lg" data-skip' + (state.isSubmitting ? ' disabled' : '') + '>건너뛰기</button>' +
          '<button class="btn btn-primary btn-lg" data-submit' + (submitDisabled ? ' disabled' : '') + '>' +
            (state.isSubmitting
              ? '<span class="spinner"></span>채점 중...'
              : '제출하기' + icon('send', 20, '#fff')) +
          '</button>' +
        '</div>' +
      '</main>' +

      (state.showFeedback && state.feedbackData ? renderFeedbackModal() : '') +
      (state.showSkipConfirm ? renderSkipModal() : '') +
    '</div>';
}

function renderFeedbackModal() {
  const f = state.feedbackData;
  return '' +
    '<div class="overlay"><div class="modal-panel modal-md">' +
      '<div class="fb-icon-wrap"><div class="fb-icon" style="background:' +
        (f.isCorrect ? 'var(--color-success-light)' : 'var(--color-error-light)') + '">' +
        (f.isCorrect
          ? icon('checkCircle', 40, 'var(--color-success)')
          : icon('xCircle', 40, 'var(--color-error)')) +
      '</div></div>' +
      '<h3 class="fb-result" style="color:' +
        (f.isCorrect ? 'var(--color-success)' : 'var(--color-error)') + '">' +
        (f.isCorrect ? '정답입니다!' : '오답입니다') + '</h3>' +
      (!f.isCorrect
        ? '<div class="fb-answer"><span class="lbl">정답:</span><p>' + esc(f.correctAnswer) + '</p></div>'
        : '') +
      (f.explanation ? '<div class="fb-explain">' + esc(f.explanation) + '</div>' : '') +
      '<button class="btn btn-primary btn-lg" style="width:100%" data-continue>다음 문제</button>' +
    '</div></div>';
}

function renderSkipModal() {
  return '' +
    '<div class="overlay blurred"><div class="modal-panel modal-sm">' +
      '<div class="text-center" style="margin-bottom:24px">' +
        '<div style="width:48px;height:48px;border-radius:50%;display:flex;align-items:center;' +
          'justify-content:center;margin:0 auto 16px;background:var(--color-warning-light)">' +
          icon('alertCircle', 24, 'var(--color-warning-dark)') + '</div>' +
        '<h3 style="font-size:var(--font-size-lg);font-weight:700;margin:0 0 8px">문제를 건너뛰시겠습니까?</h3>' +
        '<p style="font-size:var(--font-size-sm);color:var(--color-text-secondary);line-height:1.6;margin:0">' +
          '건너뛰기를 할 시 <strong style="color:var(--color-error)">오답 처리</strong>됩니다.<br />' +
          '<span style="font-size:var(--font-size-xs);color:var(--color-text-tertiary)">(타이머가 일시 정지되었습니다)</span>' +
        '</p>' +
      '</div>' +
      '<div class="flex gap-3">' +
        '<button class="btn btn-ghost btn-md flex-1" data-skip-cancel>취소</button>' +
        '<button class="btn btn-danger btn-md flex-1" data-skip-confirm>확인</button>' +
      '</div>' +
    '</div></div>';

/* =============================================================================
   화면 5 — SessionComplete
   ============================================================================= */
function renderComplete() {
  const s = state.summary || {
    totalQuestions: state.solvedCount,
    correctCount: state.correctCount,
    incorrectCount: state.solvedCount - state.correctCount,
    averageResponseTimeMs: avgTime(),
  };
  const accuracy = s.totalQuestions > 0
    ? Math.round((s.correctCount / s.totalQuestions) * 100) : 0;
  const avg = (s.averageResponseTimeMs / 1000).toFixed(1);

  return '' +
    '<div class="screen complete-screen"><div class="complete-card">' +
      '<div class="cc-trophy">' + icon('trophy', 48, 'var(--color-warning)') + '</div>' +
      '<h2 class="cc-h2">학습 완료!</h2>' +
      '<p class="cc-sub">오늘의 연속 학습을 완료했습니다.</p>' +
      '<div class="cc-stats">' +
        '<div><p class="cc-stat-value" style="color:var(--color-primary)">' + s.totalQuestions + '</p>' +
          '<p class="cc-stat-label">총 문제</p></div>' +
        '<div><p class="cc-stat-value" style="color:var(--color-success)">' + accuracy + '%</p>' +
          '<p class="cc-stat-label">정답률</p></div>' +
        '<div><p class="cc-stat-value" style="color:var(--color-info)">' + avg + 's</p>' +
          '<p class="cc-stat-label">평균 시간</p></div>' +
      '</div>' +
      '<div class="cc-detail">' +
        '<div>' + icon('checkCircle', 18, 'var(--color-success)') + '<span>' + s.correctCount + ' 정답</span></div>' +
        '<div>' + icon('xCircle', 18, 'var(--color-error)') + '<span>' + s.incorrectCount + ' 오답</span></div>' +
      '</div>' +
      '<div class="cc-actions">' +
        '<button class="btn btn-outline btn-md" data-retry>' + icon('refreshCw', 18) + '다시 학습하기</button>' +
        '<button class="btn btn-primary btn-lg" data-return-course>코스로 돌아가기</button>' +
      '</div>' +
    '</div></div>';
}

function avgTime() {
  if (!state.responseTimes.length) return 0;
  const sum = state.responseTimes.reduce(function (a, b) { return a + b; }, 0);
  return sum / state.responseTimes.length;
}

/* =============================================================================
   준비중 화면 (QuizContestComingSoon / COMMENTLE)
   ============================================================================= */
function renderComingSoon(title, desc) {
  return '' +
    '<div class="screen soon-screen">' +
      '<h2 class="soon-title">' + esc(title) + '</h2>' +
      '<p class="soon-desc">' + esc(desc) + '</p>' +
      '<button class="btn btn-primary btn-md" data-nav="/quiz">' + icon('arrowLeft', 18) + '퀴즈 홈으로</button>' +
    '</div>';
}

/* =============================================================================
   렌더 & 이벤트 위임
   ============================================================================= */
function render() {
  let html = '';
  switch (state.screen) {
    case 'game': html = renderGameSelection(); break;
    case 'courses': html = renderCourseList(); break;
    case 'detail': html = renderCourseDetail(); break;
    case 'session': html = renderSession(); break;
    case 'complete': html = renderComplete(); break;
    case 'contest':
      html = renderComingSoon('QUIZ CONTEST 준비중',
        '실시간 온라인 대전 모드는 아직 개발 중입니다. 원본 서비스에서도 준비중 화면이 노출됩니다.');
      break;
    case 'commentle':
      html = renderComingSoon('COMMENTLE는 이 데모에 포함되지 않았습니다',
        'S-ROBERTA 임베딩 기반 시맨틱 퀴즈로, AI 서버가 필요해 이번 데모에서는 제외했습니다.');
      break;
  }
  if (state.toast) html += '<div class="toast">' + esc(state.toast) + '</div>';

  app.innerHTML = html;
  routeLabel.textContent = location.hash || '#/quiz';

  if (state.screen === 'game') { startTyping(); bindMascot(); }
  if (state.screen === 'session') focusInput();
}

/* --- COMMENTLE 카드 타이핑 애니메이션 --- */
let typingTimer = null;
function startTyping() {
  clearInterval(typingTimer);
  const el = document.getElementById('typingText');
  if (!el) return;
  const text = 'ALGORITHM';
  let i = 0;
  typingTimer = setInterval(function () {
    const node = document.getElementById('typingText');
    if (!node) { clearInterval(typingTimer); return; }
    if (i < text.length) { node.textContent = text.slice(0, ++i); }
    else { setTimeout(function () { i = 0; if (node) node.textContent = ''; }, 2000); }
  }, 150);
}

/* --- 마스코트 눈동자 커서 추적 --- */
function bindMascot() {
  const mascot = document.getElementById('mascot');
  if (!mascot) return;
  const pupils = mascot.querySelectorAll('[data-pupil]');
  window.onmousemove = function (e) {
    const rect = mascot.getBoundingClientRect();
    const dx = e.clientX - (rect.left + rect.width / 2);
    const dy = e.clientY - (rect.top + rect.height / 2);
    const dist = Math.sqrt(dx * dx + dy * dy);
    const maxMove = 3;
    const nx = dist > 0 ? dx / dist : 0;
    const ny = dist > 0 ? dy / dist : 0;
    const move = Math.min(dist / 100, 1) * maxMove;
    pupils.forEach(function (p) {
      p.style.transform = 'translate(' + (nx * move) + 'px,' + (ny * move) + 'px)';
    });
  };
}

function focusInput() {
  const input = document.getElementById('shortAnswer');
  if (input && !state.showFeedback && !state.showSkipConfirm) {
    const len = input.value.length;
    input.focus();
    input.setSelectionRange(len, len);
  }
}

/* --- 제출 / 채점 --- */
function handleSubmit() {
  if (!isAnswerValid() || state.isSubmitting) return;
  const q = currentQuestion();
  const elapsed = timer.stop();

  state.isSubmitting = true;
  render();

  // 서버 왕복을 흉내내기 위한 지연 (채점 중... 상태 노출)
  setTimeout(function () {
    // 클라이언트는 선택한 답안 값만 전달한다 — isCorrect는 보내지 않는다
    const result = server.submitAnswer(q.id, state.answer);

    state.responseTimes.push(elapsed);
    state.solvedCount += 1;
    if (result.isCorrect) state.correctCount += 1;

    state.isSubmitting = false;
    state.feedbackData = result;
    state.showFeedback = true;
    render();
  }, 320);
}

function handleNextQuestion() {
  state.showFeedback = false;
  state.feedbackData = null;
  state.answer = null;
  state.index += 1;

  if (state.index >= state.queue.length) {
    state.summary = {
      totalQuestions: state.solvedCount,
      correctCount: state.correctCount,
      incorrectCount: state.solvedCount - state.correctCount,
      averageResponseTimeMs: avgTime(),
    };
    // 완료 화면은 세션의 결과이므로 히스토리를 새로 쌓지 않는다.
    // 여기서 뒤로가기를 누르면 세션을 반복하지 않고 코스 상세로 돌아간다.
    state.screen = 'complete';
    window.scrollTo(0, 0);
    render();
    return;
  }
  timer.start();
  render();
}

function handleSkipConfirm() {
  const q = currentQuestion();
  const elapsed = timer.stop();

  state.showSkipConfirm = false;
  state.responseTimes.push(elapsed);
  state.solvedCount += 1; // 건너뛰기는 오답 처리 (정답 수는 늘지 않음)

  const result = server.submitAnswer(q.id, null);
  state.feedbackData = { isCorrect: false, correctAnswer: result.correctAnswer, explanation: result.explanation };
  state.showFeedback = true;
  render();
}

/* --- 이벤트 위임 --- */
app.addEventListener('click', function (e) {
  const t = e.target;

  const nav = t.closest('[data-nav]');
  if (nav) { go(nav.getAttribute('data-nav')); return; }

  // 게임 카드
  const gameCard = t.closest('[data-game]');
  if (gameCard) {
    const id = gameCard.getAttribute('data-game');
    if (id === 'practice') go('/quiz-practice');
    else if (id === 'contest') go('/quiz-contest');
    else go('/quiz-commentle');
    return;
  }

  // 필터
  const filterBtn = t.closest('[data-filter]');
  if (filterBtn) { state.filter = filterBtn.getAttribute('data-filter'); render(); return; }

  // 코스 카드
  const courseCard = t.closest('[data-course]');
  if (courseCard) { go('/quiz-practice/' + Number(courseCard.getAttribute('data-course'))); return; }

  // 섹션 클릭 → 학습량 설정 모달
  const sectionBtn = t.closest('[data-section]');
  if (sectionBtn) {
    state.pendingSection = Number(sectionBtn.getAttribute('data-section'));
    state.showLimitModal = true;
    render();
    return;
  }

  // 학습량 모달
  const limitBtn = t.closest('[data-limit]');
  if (limitBtn) { state.limit = Number(limitBtn.getAttribute('data-limit')); render(); return; }
  if (t.closest('[data-limit-cancel]') || t.matches('[data-overlay="limit"]')) {
    state.showLimitModal = false; render(); return;
  }
  if (t.closest('[data-limit-start]')) {
    state.showLimitModal = false;
    startSession(state.courseId, state.pendingSection, state.limit);
    return;
  }

  // 세션 — 선택지
  const optionBtn = t.closest('[data-option]');
  if (optionBtn) {
    const id = optionBtn.getAttribute('data-option');
    const q = currentQuestion();
    if (q.type === 'single-choice') {
      state.answer = id;
    } else {
      const cur = Array.isArray(state.answer) ? state.answer.slice() : [];
      const idx = cur.indexOf(id);
      if (idx === -1) cur.push(id); else cur.splice(idx, 1);
      state.answer = cur;
    }
    render();
    return;
  }

  if (t.closest('[data-submit]')) { handleSubmit(); return; }
  if (t.closest('[data-continue]')) { handleNextQuestion(); return; }

  if (t.closest('[data-skip]')) {
    timer.pause();
    state.showSkipConfirm = true;
    render();
    return;
  }
  if (t.closest('[data-skip-cancel]')) {
    state.showSkipConfirm = false;
    timer.resume();
    render();
    return;
  }
  if (t.closest('[data-skip-confirm]')) { handleSkipConfirm(); return; }

  if (t.closest('[data-session-exit]')) { go('/quiz-practice/' + state.courseId); return; }
  if (t.closest('[data-return-course]')) { go('/quiz-practice/' + state.courseId); return; }
  // 다시 학습하기 — 같은 섹션이라 URL이 바뀌지 않으므로 히스토리를 쌓지 않는다
  if (t.closest('[data-retry]')) {
    prepareSession(state.courseId, state.sectionNumber, state.limit);
    render();
    return;
  }
});

// 단답형 입력
app.addEventListener('input', function (e) {
  if (e.target.id === 'shortAnswer') {
    state.answer = e.target.value;
    // 제출 버튼 활성화만 갱신 (재렌더 시 포커스 유실 방지)
    const btn = app.querySelector('[data-submit]');
    if (btn) btn.disabled = !isAnswerValid() || state.isSubmitting;
  }
});

// 단답형 Enter 제출 (IME 조합 중 무시)
app.addEventListener('keydown', function (e) {
  if (e.target.id !== 'shortAnswer') return;
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key !== 'Enter') return;
  if (state.showFeedback) return;
  e.preventDefault();
  handleSubmit();
});

// 피드백 모달에서 Enter로 다음 문제
// (제출 Enter가 모달로 전파되지 않도록 100ms 지연 후 등록 — 원본과 동일)
let feedbackKeyHandler = null;
let feedbackKeyTimeout = null;
function syncFeedbackKeyBinding() {
  clearTimeout(feedbackKeyTimeout);
  if (feedbackKeyHandler) {
    window.removeEventListener('keydown', feedbackKeyHandler);
    feedbackKeyHandler = null;
  }
  if (!state.showFeedback) return;
  feedbackKeyTimeout = setTimeout(function () {
    feedbackKeyHandler = function (e) {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key !== 'Enter') return;
      e.preventDefault();
      e.stopPropagation();
      handleNextQuestion();
    };
    window.addEventListener('keydown', feedbackKeyHandler);
  }, 100);
}

// 세션 중 복사/선택/드래그 방지 (FSRS 데이터 정확도 보호)
// 단답형 input은 예외
['copy', 'selectstart', 'contextmenu', 'dragstart'].forEach(function (evt) {
  document.addEventListener(evt, function (e) {
    if (state.screen !== 'session') return;
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    e.preventDefault();
  });
});

document.getElementById('btnHome').addEventListener('click', function () { go('/quiz'); });

// render를 감싸 피드백 키 바인딩을 동기화
const _render = render;
render = function () { _render(); syncFeedbackKeyBinding(); };

// 진입 시 해시가 없으면 /quiz 를 기본값으로 — 히스토리를 더럽히지 않도록 replace 사용
if (!location.hash) location.replace('#/quiz');
applyHash();
</script>
